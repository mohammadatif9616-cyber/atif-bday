<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Lock ❤️</title>


<link rel="stylesheet" href="css/pin.css">

</head>


<body>


<div class="lock-container">


<div class="lock-heart">
❤️
</div>


<h1>
A Secret Awaits
</h1>


<p>
Enter the special 5 letter PIN
</p>



<div class="pin-box">


<input 
type="password"
id="pinInput"
maxlength="5"
placeholder="•••••"
>


<button onclick="checkPIN()">
Unlock 🔓
</button>


</div>


<p id="message"></p>


</div>



<script src="js/pin.js"></script>


</body>

</html>
